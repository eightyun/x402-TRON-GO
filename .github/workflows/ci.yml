name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Go 1.26 checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
      X402_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/x402_tron_ci?sslmode=disable
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_DB: x402_tron_ci
          # 仅限本 job 的临时测试库，端口不暴露到外部网络；禁止照搬到部署配置。
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d x402_tron_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.x
          cache-dependency-path: go.sum
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(git ls-files -z -- '*.go' | xargs -0 gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            printf 'Go files need formatting:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Verify modules
        run: go mod verify
      - name: Verify SDK consumption from an isolated application module
        shell: bash
        env:
          GOWORK: off
        run: |
          consumer="$(mktemp -d "${RUNNER_TEMP}/x402-consumer.XXXXXX")"
          cp integration/consumer/go.mod integration/consumer/go.sum integration/consumer/consumer_test.go "${consumer}/"
          # PR源码尚未公开；只在临时消费者中替换当前源码，不改仓库或宣称公网安装。
          go -C "${consumer}" mod edit -replace="github.com/eightyun/x402-tron-go=${GITHUB_WORKSPACE}"
          go -C "${consumer}" test -mod=mod -race -count=1 -timeout=30s .
      - name: Vet implemented packages
        run: go vet . ./exact ./exact/postgres ./examples/client ./examples/payer ./internal/examplekeys ./examples/server ./examples/facilitator ./examples/deployment ./interop/bankofai/bridge ./tools/package
      - name: Run offline and PostgreSQL tests with race detection
        run: go test -race -count=1 -cover . ./exact ./exact/postgres ./examples/client ./examples/payer ./internal/examplekeys ./examples/server ./examples/facilitator ./examples/deployment ./interop/bankofai/bridge ./tools/package
      - name: Build implemented packages
        run: go build . ./exact ./exact/postgres ./examples/client ./examples/payer ./internal/examplekeys ./examples/server ./examples/facilitator ./examples/deployment ./interop/bankofai/bridge
      - name: Set up Node for SDK interoperability tests only
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: interop/bankofai/package-lock.json
      - name: Install locked upstream SDK test dependencies
        working-directory: interop/bankofai
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify offline bidirectional upstream SDK interoperability
        working-directory: interop/bankofai
        run: npm test
      - name: Build and verify unreleased Linux testnet bundle
        shell: bash
        run: |
          go run ./tools/package -targets linux/amd64 -output "${RUNNER_TEMP}/x402-testnet-packages"
          revision="$(git rev-parse --short=12 HEAD)"
          cd "${RUNNER_TEMP}/x402-testnet-packages/x402-tron-go-${revision}"
          sha256sum -c SHA256SUMS
