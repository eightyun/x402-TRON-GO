version: 2
updates:
  # SDK 主模块依赖；integration/consumer 刻意固定已发布版本，不纳入自动更新。
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      golang-x:
        patterns:
          - "golang.org/x/*"
  # 互操作测试固定精确版本；更新 PR 会因版本基线断言失败，需人工复核后同步测试。
  - package-ecosystem: npm
    directory: /interop/bankofai
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
